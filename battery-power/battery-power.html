&lt;h1&gt;Water Pipes: Capacity vs. Actual Flow&lt;/h1&gt;
&lt;p class=&quot;intro&quot;&gt;Guided interactive tutorial · Imagine a water supply feeding a main pipe that splits into five branches. Each branch supplies a different use. Opening a valve adds demand; closing it removes demand. &lt;strong&gt;The main pipe can supply up to 350 L/min, but it does not always carry 350 L/min.&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;layout&quot;&gt;&lt;section&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;1. Open and close valves&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Check a branch to open its valve. The flow rates are simplified fixed demands.&lt;/p&gt;&lt;div id=&quot;branchList&quot;&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot; style=&quot;margin-top:14px&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;allOff&quot;&gt;Close all&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;startOver&quot;&gt;Reset activity&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;2. Water available in the tank&lt;/h2&gt;&lt;p&gt;Assume a tank holds &lt;strong&gt;700 liters&lt;/strong&gt; of usable water. The flow rate determines how quickly it empties.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;This is an ideal model: no leaks, no pressure changes, and no refill while the branches are open.&lt;/p&gt;&lt;/div&gt;
&lt;/section&gt;&lt;section&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;Pipe schematic&lt;/h2&gt;&lt;svg class=&quot;diagram&quot; viewBox=&quot;0 0 770 320&quot; role=&quot;img&quot; aria-label=&quot;Water tank feeding a horizontal main pipe with five upward branches and open or closed valves&quot;&gt;
&lt;rect x=&quot;12&quot; y=&quot;135&quot; width=&quot;100&quot; height=&quot;140&quot; rx=&quot;12&quot; fill=&quot;#d6ebf9&quot; stroke=&quot;#5a8099&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;20&quot; y=&quot;177&quot; width=&quot;84&quot; height=&quot;90&quot; rx=&quot;7&quot; fill=&quot;#6db6e4&quot;/&gt;&lt;text x=&quot;62&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; class=&quot;small&quot;&gt;Water tank&lt;/text&gt;&lt;text x=&quot;62&quot; y=&quot;193&quot; text-anchor=&quot;middle&quot; class=&quot;small&quot;&gt;700 L&lt;/text&gt;
&lt;path class=&quot;pipe&quot; d=&quot;M112 228 H738&quot;/&gt;&lt;path class=&quot;water&quot; id=&quot;mainWater&quot; d=&quot;M112 228 H738&quot;/&gt;
&lt;g id=&quot;branchesSvg&quot;&gt;&lt;/g&gt;&lt;text x=&quot;127&quot; y=&quot;270&quot; class=&quot;small&quot;&gt;Main pipe · maximum 350 L/min&lt;/text&gt;&lt;text x=&quot;738&quot; y=&quot;270&quot; text-anchor=&quot;end&quot; class=&quot;flow&quot; id=&quot;mainFlowLabel&quot;&gt;Flow: 0 L/min&lt;/text&gt;
&lt;/svg&gt;&lt;div class=&quot;stats&quot;&gt;&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Maximum supply&lt;/span&gt;&lt;b&gt;350 L/min&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Actual demand&lt;/span&gt;&lt;b id=&quot;actual&quot;&gt;0 L/min&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;span&gt;Tank lasts (ideal)&lt;/span&gt;&lt;b id=&quot;duration&quot;&gt;—&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;status&quot; class=&quot;ok&quot; role=&quot;status&quot;&gt;All valves are closed. The main pipe supplies no water.&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;3. Make predictions, then test them&lt;/h2&gt;&lt;p&gt;&lt;strong&gt;Try these experiments:&lt;/strong&gt; Open only the garden hose. Then add the sink. Next open all branches. Observe the total requested flow and whether the system can meet it.&lt;/p&gt;&lt;div class=&quot;question&quot;&gt;&lt;strong&gt;Question 1.&lt;/strong&gt; Only the 40 L/min garden hose is open. How much water flows in the main pipe?&lt;div class=&quot;choices&quot; data-question=&quot;q1&quot;&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q1&quot; value=&quot;a&quot;&gt; 350 L/min&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q1&quot; value=&quot;b&quot;&gt; 40 L/min&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q1&quot; value=&quot;c&quot;&gt; 700 L/min&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;q1Feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;question&quot;&gt;&lt;strong&gt;Question 2.&lt;/strong&gt; The sink (80 L/min) and shower (120 L/min) are open. What is the total flow?&lt;div class=&quot;choices&quot; data-question=&quot;q2&quot;&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;a&quot;&gt; 200 L/min&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;b&quot;&gt; 120 L/min&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;c&quot;&gt; 350 L/min&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;q2Feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;question&quot;&gt;&lt;strong&gt;Question 3.&lt;/strong&gt; What happens if all five valves are opened at once?&lt;div class=&quot;choices&quot; data-question=&quot;q3&quot;&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q3&quot; value=&quot;a&quot;&gt; The source automatically increases its maximum capacity.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q3&quot; value=&quot;b&quot;&gt; The combined demand exceeds the supply limit, so not every branch can receive its full requested flow.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q3&quot; value=&quot;c&quot;&gt; Every branch still receives its full flow without a limit.&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;q3Feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;question&quot;&gt;&lt;strong&gt;Question 4.&lt;/strong&gt; With a 700 L tank and a total flow of 100 L/min, how long does the water last (assuming no refill)?&lt;div class=&quot;choices&quot; data-question=&quot;q4&quot;&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q4&quot; value=&quot;a&quot;&gt; 7 minutes&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q4&quot; value=&quot;b&quot;&gt; 70 minutes&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q4&quot; value=&quot;c&quot;&gt; 3.5 minutes&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;q4Feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h2&gt;4. Reflection&lt;/h2&gt;&lt;p&gt; &lt;strong&gt;Why does a main pipe capable of 350 L/min deliver only 40 L/min when just the garden hose is open? What determines how long the water tank lasts?&lt;/strong&gt;&lt;/p&gt;&lt;textarea id=&quot;reflection&quot; rows=&quot;4&quot; style=&quot;width:100%;border:1px solid #bdcbd7;border-radius:9px;padding:11px;font:inherit&quot; placeholder=&quot;Write your explanation here...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;actions&quot; style=&quot;margin-top:10px&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;copy&quot;&gt;Copy my explanation&lt;/button&gt;&lt;span class=&quot;muted&quot; id=&quot;copyStatus&quot; role=&quot;status&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/main&gt;&lt;script&gt;

al+&#x27; L/min&#x27;;document.getElementById(&#x27;duration&#x27;).textContent=total===0?&#x27;No flow&#x27;:total&gt;350?&#x27;Over limit&#x27;:(700/total).toFixed(1)+&#x27; min&#x27;;document.getElementById(&#x27;mainFlowLabel&#x27;).textContent=&#x27;Requested: &#x27;+total+&#x27; L/min&#x27;;const status=document.getElementById(&#x27;status&#x27;);status.className=total&gt;350?&#x27;warning&#x27;:&#x27;ok&#x27;;status.textContent=total===0?&#x27;All valves are closed. The main pipe supplies no water.&#x27;:total&gt;350?`Demand is ${total} L/min, exceeding the 350 L/min supply limit by ${total-350} L/min. In real plumbing, flow/pressure would drop or some uses would be restricted.`:`The open branches request ${total} L/min, within the 350 L/min maximum. The main pipe delivers only the amount requested.`;branchElements.forEach((b,i)=&gt;{const on=state.has(i);b.cb.checked=on;b.water.setAttribute(&#x27;class&#x27;,on?&#x27;branchWater&#x27;:&#x27;off&#x27;);b.g.setAttribute(&#x27;class&#x27;,on?&#x27;&#x27;:&#x27;closed&#x27;)});document.getElementById(&#x27;mainWater&#x27;).setAttribute(&#x27;stroke&#x27;,total===0?&#x27;#cddce7&#x27;:&#x27;#168ed1&#x27;);}document.getElementById(&#x27;allOff&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{state.clear();update()});document.getElementById(&#x27;startOver&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{state.clear();document.querySelectorAll(&#x27;input[type=radio]&#x27;).forEach(e=&gt;e.checked=false);document.querySelectorAll(&#x27;.feedback&#x27;).forEach(e=&gt;e.textContent=&#x27;&#x27;);document.getElementById(&#x27;reflection&#x27;).value=&#x27;&#x27;;document.getElementById(&#x27;copyStatus&#x27;).textContent=&#x27;&#x27;;update()});const answers={q1:[&#x27;b&#x27;,&#x27;With only the garden hose open, the demand is 40 L/min.&#x27;],q2:[&#x27;a&#x27;,&#x27;80 + 120 = 200 L/min.&#x27;],q3:[&#x27;b&#x27;,&#x27;All branches request 400 L/min, above the 350 L/min supply limit.&#x27;],q4:[&#x27;a&#x27;,&#x27;700 L ÷ 100 L/min = 7 minutes.&#x27;]};document.querySelectorAll(&#x27;.choices&#x27;).forEach(group=&gt;group.addEventListener(&#x27;change&#x27;,e=&gt;{if(e.target.type!==&#x27;radio&#x27;)return;const id=group.dataset.question;const [correct,why]=answers[id];document.getElementById(id+&#x27;Feedback&#x27;).textContent=(e.target.value===correct?&#x27;Correct. &#x27;:&#x27;Try again. &#x27;)+why}));document.getElementById(&#x27;copy&#x27;).addEventListener(&#x27;click&#x27;,async()=&gt;{const text=document.getElementById(&#x27;reflection&#x27;).value.trim();const out=document.getElementById(&#x27;copyStatus&#x27;);if(!text){out.textContent=&#x27;Write an explanation first.&#x27;;return}try{await navigator.clipboard.writeText(text);out.textContent=&#x27;Copied. Paste it into Learning Suite.&#x27;}catch{document.getElementById(&#x27;reflection&#x27;).select();out.textContent=&#x27;Text selected. Press Ctrl+C or Cmd+C to copy.&#x27;}});update()})();

&lt;h1&gt;Battery-Power Tutorial&lt;/h1&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;1. Understand the analogy&lt;/h2&gt;&lt;p&gt;Imagine a tank supplying water through a main pipe that divides into branches. Each branch serves a different device. Opening a valve is like plugging in and turning on a device.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Water flow rate (L/min)&lt;/strong&gt; represents electrical &lt;strong&gt;power (W)&lt;/strong&gt;. &lt;strong&gt;Water stored in the tank (L)&lt;/strong&gt; represents battery &lt;strong&gt;energy (Wh)&lt;/strong&gt;. The main pipe&#x27;s &lt;strong&gt;maximum flow capacity&lt;/strong&gt; represents the power station&#x27;s &lt;strong&gt;maximum output rating&lt;/strong&gt;.&lt;/p&gt;&lt;p class=&quot;foot&quot;&gt;This is a conceptual analogy, not a detailed hydraulic or electrical circuit model. We assume each open branch draws a fixed flow rate, provided the source can supply the total.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;&lt;section&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;2. Connect or disconnect devices&lt;/h2&gt;&lt;p class=&quot;foot&quot;&gt;Select the devices. Try one, several, and then all of them.&lt;/p&gt;&lt;div id=&quot;deviceList&quot;&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot; style=&quot;margin-top:15px&quot;&gt;&lt;button id=&quot;clear&quot; class=&quot;secondary&quot;&gt;Disconnect all devices&lt;/button&gt;&lt;button id=&quot;reset&quot;&gt;Reset&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Source specifications&lt;/h2&gt;&lt;div class=&quot;stats&quot; style=&quot;grid-template-columns:1fr 1fr&quot;&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Battery energy capacity&lt;/small&gt;&lt;strong&gt;296&lt;/strong&gt;&lt;small&gt;Wh&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Maximum output power&lt;/small&gt;&lt;strong&gt;350&lt;/strong&gt;&lt;small&gt;W&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;3. Watch electrical power flow through wires to devices&lt;/h2&gt;&lt;svg id=&quot;schematic&quot; class=&quot;diagram&quot; viewBox=&quot;0 0 790 355&quot; role=&quot;img&quot; aria-label=&quot;Portable battery with a main electrical wire branching to six devices. Active wires turn blue.&quot;&gt;&lt;rect x=&quot;8&quot; y=&quot;8&quot; width=&quot;774&quot; height=&quot;339&quot; rx=&quot;12&quot; fill=&quot;#f5f9fc&quot;/&gt;&lt;g role=&quot;img&quot; aria-label=&quot;Illustration of a portable battery power station&quot;&gt;&lt;rect x=&quot;23&quot; y=&quot;149&quot; width=&quot;112&quot; height=&quot;124&quot; rx=&quot;14&quot; fill=&quot;#2e475b&quot; stroke=&quot;#152b3c&quot; stroke-width=&quot;3&quot;/&gt;&lt;rect x=&quot;36&quot; y=&quot;164&quot; width=&quot;86&quot; height=&quot;37&quot; rx=&quot;5&quot; fill=&quot;#c3e9ec&quot;/&gt;&lt;rect id=&quot;batteryLevel&quot; x=&quot;40&quot; y=&quot;168&quot; width=&quot;78&quot; height=&quot;29&quot; rx=&quot;3&quot; fill=&quot;#36b989&quot;/&gt;&lt;text x=&quot;79&quot; y=&quot;184&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;bold&quot; fill=&quot;#12334b&quot;&gt;100%&lt;/text&gt;&lt;circle cx=&quot;49&quot; cy=&quot;228&quot; r=&quot;10&quot; fill=&quot;#e9f0f4&quot;/&gt;&lt;circle cx=&quot;79&quot; cy=&quot;228&quot; r=&quot;10&quot; fill=&quot;#e9f0f4&quot;/&gt;&lt;circle cx=&quot;109&quot; cy=&quot;228&quot; r=&quot;10&quot; fill=&quot;#e9f0f4&quot;/&gt;&lt;text x=&quot;79&quot; y=&quot;258&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; fill=&quot;white&quot;&gt;296 Wh&lt;/text&gt;&lt;rect x=&quot;61&quot; y=&quot;141&quot; width=&quot;36&quot; height=&quot;9&quot; rx=&quot;3&quot; fill=&quot;#162f41&quot;/&gt;&lt;/g&gt;&lt;path class=&quot;main-wire&quot; d=&quot;M124 224 H750&quot;/&gt;&lt;path class=&quot;live-wire&quot; d=&quot;M124 224 H750&quot; id=&quot;mainWater&quot;/&gt;&lt;text x=&quot;428&quot; y=&quot;266&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;#41617a&quot;&gt;Maximum output power: 350 W&lt;/text&gt;&lt;g id=&quot;branches&quot;&gt;&lt;/g&gt;&lt;/svg&gt;&lt;div class=&quot;stats&quot;&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Total requested power&lt;/small&gt;&lt;strong id=&quot;total&quot;&gt;0&lt;/strong&gt;&lt;small&gt;W&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Unused power capacity&lt;/small&gt;&lt;strong id=&quot;remaining&quot;&gt;350&lt;/strong&gt;&lt;small&gt;W&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;small&gt;Ideal battery runtime&lt;/small&gt;&lt;strong id=&quot;runtime&quot;&gt;—&lt;/strong&gt;&lt;small&gt;hours&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;status&quot; aria-live=&quot;polite&quot; class=&quot;good&quot;&gt;No devices connected. No electrical power is drawn.&lt;/p&gt;&lt;p class=&quot;good&quot; style=&quot;margin-top:7px&quot;&gt;&lt;strong&gt;Ideal operating time = energy available (Wh) / total output power (W)&lt;/strong&gt;&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Notice:&lt;/strong&gt; The source is capable of supplying &lt;strong&gt;up to&lt;/strong&gt; 350 W, but it supplies only the amount requested by connected devices. A 350 W power station does not force 350 W into a 50 W laptop.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;4. Predict, test, and explain&lt;/h2&gt;&lt;div class=&quot;qa&quot;&gt;&lt;p&gt;&lt;strong&gt;Question 1.&lt;/strong&gt; Only the 50 W laptop is plugged in. What is the power station&#x27;s actual output?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q1&quot; value=&quot;a&quot;&gt; 350 W&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q1&quot; value=&quot;b&quot;&gt; 50 W&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q1&quot; value=&quot;c&quot;&gt; 296 W&lt;/label&gt;&lt;div id=&quot;f1&quot; class=&quot;feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa&quot;&gt;&lt;p&gt;&lt;strong&gt;Question 2.&lt;/strong&gt; You plug in a 50 W laptop and a 100 W television. What is the ideal runtime?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;a&quot;&gt; About 1.97 hours&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;b&quot;&gt; About 5.92 hours&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q2&quot; value=&quot;c&quot;&gt; About 0.85 hours&lt;/label&gt;&lt;div id=&quot;f2&quot; class=&quot;feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa&quot;&gt;&lt;p&gt;&lt;strong&gt;Question 3.&lt;/strong&gt; What happens if the combined demand exceeds 350 W?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q3&quot; value=&quot;a&quot;&gt; The power station must supply the full demand.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q3&quot; value=&quot;b&quot;&gt; The power station may shut down or refuse the load.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q3&quot; value=&quot;c&quot;&gt; The battery&#x27;s stored energy immediately increases.&lt;/label&gt;&lt;div id=&quot;f3&quot; class=&quot;feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa&quot;&gt;&lt;p&gt;&lt;strong&gt;Question 4.&lt;/strong&gt; If you unplug a device, what changes immediately in the simplified model?&lt;/p&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q4&quot; value=&quot;a&quot;&gt; The maximum output rating decreases.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q4&quot; value=&quot;b&quot;&gt; The rated battery capacity increases.&lt;/label&gt;&lt;label&gt;&lt;input type=&quot;radio&quot; name=&quot;q4&quot; value=&quot;c&quot;&gt; The total power drawn decreases.&lt;/label&gt;&lt;div id=&quot;f4&quot; class=&quot;feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;5. Reflection&lt;/h2&gt;&lt;p&gt;Explain, in your own words, why a 296 Wh / 350 W power station can run a 50 W laptop for approximately 5.92 hours even though its maximum output rating is 350 W. Explain how connecting additional devices changes the power drawn and operating time.&lt;/p&gt;&lt;textarea id=&quot;reflection&quot; placeholder=&quot;Write your explanation here...&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;controls&quot; style=&quot;margin-top:10px&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;copy&quot;&gt;Copy reflection&lt;/button&gt;&lt;span id=&quot;copyStatus&quot; class=&quot;foot&quot; aria-live=&quot;polite&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/main&gt;&lt;script&gt;
(()=&gt;{&#x27;use strict&#x27;;const devices=[[&#x27;Laptop&#x27;,50],[&#x27;Phone charger&#x27;,15],[&#x27;LED lamp&#x27;,10],[&#x27;Small fan&#x27;,40],[&#x27;Television&#x27;,100],[&#x27;Hair dryer&#x27;,1200]];const selected=new Set();const list=document.getElementById(&#x27;deviceList&#x27;), branches=document.getElementById(&#x27;branches&#x27;);const svgNS=&#x27;http://www.w3.org/2000/svg&#x27;;const make=(tag,attrs,text)=&gt;{const el=document.createElementNS(svgNS,tag);Object.entries(attrs).forEach(([k,v])=&gt;el.setAttribute(k,String(v)));if(text!==undefined)el.textContent=text;return el;};devices.forEach(([name,watts],i)=&gt;{const row=document.createElement(&#x27;div&#x27;);row.className=&#x27;device&#x27;;const lab=document.createElement(&#x27;label&#x27;);const box=document.createElement(&#x27;input&#x27;);box.type=&#x27;checkbox&#x27;;box.dataset.i=i;lab.append(box,document.createTextNode(name));const small=document.createElement(&#x27;small&#x27;);small.textContent=watts+&#x27; W&#x27;;row.append(lab,small);list.append(row);box.addEventListener(&#x27;change&#x27;,()=&gt;{box.checked?selected.add(i):selected.delete(i);update();});});function update(){const total=[...selected].reduce((s,i)=&gt;s+devices[i][1],0);document.getElementById(&#x27;total&#x27;).textContent=total;document.getElementById(&#x27;remaining&#x27;).textContent=Math.max(0,350-total);document.getElementById(&#x27;runtime&#x27;).textContent=total===0?&#x27;—&#x27;:total&gt;350?&#x27;N/A&#x27;:(296/total).toFixed(2);const status=document.getElementById(&#x27;status&#x27;);if(total===0){status.textContent=&#x27;No devices connected. No electrical power is drawn.&#x27;;status.className=&#x27;good&#x27;;}else if(total&gt;350){status.textContent=`Overload: ${total} W requested exceeds the 350 W maximum. The station cannot supply this combination.`;status.className=&#x27;warn&#x27;;}else{status.textContent=`The station supplies ${total} W, not 350 W. Ideal runtime: ${(296/total).toFixed(2)} hours.`;status.className=&#x27;good&#x27;;}document.getElementById(&#x27;mainWater&#x27;).setAttribute(&#x27;stroke&#x27;,total&gt;0&amp;&amp;total&lt;=350?&#x27;#209cdb&#x27;:total&gt;350?&#x27;#d77b49&#x27;:&#x27;#a7bdcb&#x27;);branches.replaceChildren();devices.forEach(([name,watts],i)=&gt;{const x=183+i*105, on=selected.has(i);branches.append(make(&#x27;path&#x27;,{d:`M${x} 224 V112`,class:&#x27;branch-wire&#x27;+(on?&#x27; on&#x27;:&#x27;&#x27;)}));branches.append(make(&#x27;circle&#x27;,{cx:x,cy:165,r:13,class:&#x27;connection&#x27;+(on?&#x27; on&#x27;:&#x27;&#x27;)}));branches.append(make(&#x27;path&#x27;,{d:`M${x-8} 157 L${x+8} 173 M${x+8} 157 L${x-8} 173`,stroke:&#x27;white&#x27;,&#x27;stroke-width&#x27;:3}));branches.append(make(&#x27;text&#x27;,{x,y:78,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;branchlabel&#x27;},name));branches.append(make(&#x27;text&#x27;,{x,y:97,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;branchlabel&#x27;},watts+&#x27; W&#x27;));branches.append(make(&#x27;text&#x27;,{x,y:129,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:12,fill:on?&#x27;#14774c&#x27;:&#x27;#7b8791&#x27;},on?&#x27;ON&#x27;:&#x27;OFF&#x27;));});}document.getElementById(&#x27;clear&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{selected.clear();document.querySelectorAll(&#x27;#deviceList input&#x27;).forEach(x=&gt;x.checked=false);update();});document.getElementById(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{selected.clear();selected.add(0);document.querySelectorAll(&#x27;#deviceList input&#x27;).forEach(x=&gt;x.checked=selected.has(+x.dataset.i));update();});const answers=[&#x27;b&#x27;,&#x27;a&#x27;,&#x27;b&#x27;,&#x27;c&#x27;], explanations=[&#x27;The laptop draws 50 W; 350 W is the maximum.&#x27;,&#x27;296 Wh / (50 W + 100 W) = 1.97 h.&#x27;,&#x27;Demand above the output rating may trigger an overload shutdown.&#x27;,&#x27;Unplugging a device reduces demand; it does not change the station’s ratings.&#x27;];
answers.forEach((answer,i)=&gt;{document.querySelectorAll(`input[name=q${i+1}]`).forEach(radio=&gt;radio.addEventListener(&#x27;change&#x27;,()=&gt;{const feedback=document.getElementById(&#x27;f&#x27;+(i+1)),correct=radio.value===answer;feedback.textContent=(correct?&#x27;Correct! &#x27;:&#x27;Incorrect. &#x27;)+(correct?explanations[i]:&#x27;Try again. Think about the difference between stored energy, maximum power, and actual demand.&#x27;);feedback.className=&#x27;feedback &#x27;+(correct?&#x27;good&#x27;:&#x27;warn&#x27;);}));});
document.getElementById(&#x27;copy&#x27;).addEventListener(&#x27;click&#x27;,async()=&gt;{const t=document.getElementById(&#x27;reflection&#x27;).value,s=document.getElementById(&#x27;copyStatus&#x27;);if(!t.trim()){s.textContent=&#x27;Write your reflection first.&#x27;;return;}try{await navigator.clipboard.writeText(t);s.textContent=&#x27;Copied. Paste into Learning Suite.&#x27;;}catch{document.getElementById(&#x27;reflection&#x27;).select();s.textContent=&#x27;Text selected. Press Ctrl+C or Command+C to copy.&#x27;;}});selected.add(0);document.querySelector(&#x27;#deviceList input&#x27;).checked=true;update();})();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;

<script>
(()=>{'use strict';const tabs=[document.getElementById('waterTab'),document.getElementById('batteryTab')],panels=[document.getElementById('waterPanel'),document.getElementById('batteryPanel')];function select(i){tabs.forEach((tab,j)=>{const on=i===j;tab.setAttribute('aria-selected',String(on));tab.tabIndex=on?0:-1;panels[j].hidden=!on});resize();}tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(i));tab.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const j=(i+(e.key==='ArrowRight'?1:-1)+2)%2;select(j);tabs[j].focus();}})});function resize(){for(const frame of document.querySelectorAll('iframe')){try{const doc=frame.contentDocument;if(doc&&doc.body){frame.style.height=Math.max(850,doc.documentElement.scrollHeight,doc.body.scrollHeight+20)+'px'}}catch(e){frame.style.height='1500px'}}}for(const f of document.querySelectorAll('iframe')){f.addEventListener('load',()=>{resize();try{new ResizeObserver(resize).observe(f.contentDocument.body)}catch(e){}})}window.addEventListener('resize',resize);select(0);})();
</script></body></html>
